<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <!-- Background with smooth rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#grad)" />
  
  <!-- Subtle border highlight -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#292524" stroke-width="8" />

  <!-- Calculator frame -->
  <rect x="116" y="96" width="280" height="320" rx="40" fill="#292524" stroke="#44403c" stroke-width="12" />

  <!-- Screen / Display -->
  <rect x="152" y="136" width="208" height="64" rx="16" fill="#1c1917" />
  <rect x="280" y="156" width="60" height="24" rx="6" fill="url(#emeraldGrad)" />

  <!-- Keypad buttons -->
  <!-- Row 1 -->
  <rect x="152" y="228" width="52" height="44" rx="12" fill="#3b3634" />
  <rect x="230" y="228" width="52" height="44" rx="12" fill="#3b3634" />
  <rect x="308" y="228" width="52" height="44" rx="12" fill="url(#emeraldGrad)" />

  <!-- Row 2 -->
  <rect x="152" y="292" width="52" height="44" rx="12" fill="#3b3634" />
  <rect x="230" y="292" width="52" height="44" rx="12" fill="#3b3634" />
  <rect x="308" y="292" width="52" height="44" rx="12" fill="url(#emeraldGrad)" />

  <!-- Row 3 -->
  <rect x="152" y="356" width="52" height="44" rx="12" fill="#3b3634" />
  <rect x="230" y="356" width="52" height="44" rx="12" fill="#3b3634" />
  <rect x="308" y="356" width="52" height="44" rx="12" fill="url(#emeraldGrad)" />
</svg>